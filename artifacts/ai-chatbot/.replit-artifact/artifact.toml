kind = "web"
previewPath = "/"
title = "AI Chatbot"
description = "A simple AI chat app for asking questions and getting helpful responses in a focused conversation."
version = "1.0.0"
id = "artifacts/ai-chatbot"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18434

[services.development]
run = "pnpm --filter @workspace/ai-chatbot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-chatbot", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-chatbot/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18434"
BASE_PATH = "/"
