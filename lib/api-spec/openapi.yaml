openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /conversations:
    get:
      operationId: listConversations
      tags: [chat]
      summary: List saved conversations
      responses:
        "200":
          description: Recent conversations for the current anonymous browser session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatConversationSummary"
        "503":
          description: Supabase is unavailable or the chat schema is not installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /conversations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getConversation
      tags: [chat]
      summary: Retrieve a saved conversation
      responses:
        "200":
          description: Saved conversation and its messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversation"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Supabase is unavailable or the chat schema is not installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteConversation
      tags: [chat]
      summary: Delete a saved conversation
      responses:
        "204":
          description: Conversation deleted
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Supabase is unavailable or the chat schema is not installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /chat:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to the AI assistant
      description: Returns an AI response and saves the exchange to Supabase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Chat service is not configured or Supabase is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 50000
      required:
        - role
        - content
    ChatRequest:
      type: object
      properties:
        conversationId:
          type: ["string", "null"]
          format: uuid
          description: Existing conversation to continue, or null to start a new one
        message:
          type: string
          minLength: 1
          maxLength: 12000
      required:
        - message
    ChatResponse:
      type: object
      properties:
        conversationId:
          type: string
          format: uuid
        reply:
          type: string
      required:
        - conversationId
        - reply
    ChatConversationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
      required: [id, title, updatedAt]
    ChatConversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, title, messages, createdAt, updatedAt]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

